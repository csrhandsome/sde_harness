[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sde-harness"
version = "0.0.1"
description = "Harness VLA agent framework adapted for VLA-Adapter (from RPent)"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.10,<3.13"
dependencies = [
    "pydantic-ai-slim[anthropic,openai]>=2.1",
    "pydantic>=2",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "httpx>=0.27",
    "claude-agent-sdk>=0.1.60",
    "openai-codex>=0.1.0b3",
    "cursor-sdk>=1.0.0",
    "huggingface_hub>=0.24",
    "prompt-toolkit>=3.0.48",
    "numpy",
    "imageio>=2.0",
    "scipy",
]

[project.scripts]
sde-harness = "rpent.cli.main:main"
rpent = "rpent.cli.main:main"

[project.optional-dependencies]
sam3 = [
    "sam3==0.1.4",
    "torch",
    "torchvision",
    "pillow>=10",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["rpent*"]
exclude = ["tests*", "docs*", "scripts*"]
