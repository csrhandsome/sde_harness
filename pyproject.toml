[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "vla-adapter"
authors = [
    {name = "Yihao Wang", email="yh-wang@bupt.edu.cn"},
    {name = "Pengxiang Ding", email="dingpx2015@gmail.com"},
    {name = "Lingxiao Li", email="lingxiao-li@bupt.edu.cn"},
]
description = "VLA-Adapter: An Effective Paradigm for Tiny-Scale Vision-Language-Action Model"
version = "0.0.1"
readme = "README.md"
# Harness (sde_harness) needs 3.10–3.12; keep one shared root env.
requires-python = ">=3.10,<3.13"
keywords = ["vision-language-action models", "tiny-scale backbone", "fine-tuning", "robotic learning"]
license = {file = "LICENSE"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "accelerate>=0.25.0",
    "draccus==0.8.0",
    "einops",
    # "flash_attn==2.5.5",      # Here for documentation -- install *AFTER* editable install (follow README)
    "huggingface_hub",
    "json-numpy",
    "jsonlines",
    "matplotlib",
    "peft==0.11.1",
    "protobuf",
    "rich",
    "sentencepiece==0.1.99",
    "timm==0.9.10",
    "tokenizers==0.19.1",
    "torch==2.2.0",
    "torchvision==0.17.0",
    "torchaudio==2.2.0",
    "transformers==4.40.1", #"transformers @ git+https://github.com/moojink/transformers-openvla-oft.git",  # IMPORTANT: Use this fork for bidirectional attn (for parallel decoding)
    "wandb",
    "tensorflow==2.15.0",
    "tensorflow_datasets==4.9.3",
    "tensorflow-metadata==1.17.3", # 1.21+ needs protobuf>=5; TF 2.15 pins protobuf 4.x
    "tensorflow_graphics==2021.12.3",
    "dlimp @ git+https://github.com/moojink/dlimp_openvla",
    "diffusers==0.30.3",
    "imageio",
    "uvicorn",
    "fastapi",
    "json-numpy",
    "wand>=0.7.2",
    "scikit-image>=0.24.0",
    # LIBERO runtime (benchmark code is on PYTHONPATH; these must survive `uv sync`)
    "bddl",
    "easydict",
    "gym",
    "imageio-ffmpeg",
    "cloudpickle",
    # Harness VLA (workspace member; `uv sync` at repo root installs both)
    "sde-harness",
]

[project.optional-dependencies]
dev = [
    "black>=24.2.0",
    "gpustat",
    "ipython",
    "pre-commit",
    "ruff>=0.2.2",
]
sagemaker = [
    "boto3",
    "sagemaker"
]

[project.urls]
homepage = "https://github.com/OpenHelix-Team/VLA-Adapter"
repository = "https://github.com/OpenHelix-Team/VLA-Adapter"
documentation = "https://github.com/OpenHelix-Team/VLA-Adapter"

[tool.setuptools.packages.find]
where = ["."]
exclude = ["cache", "sde_harness*", "serving*", "third_party*"]

[tool.setuptools.package-data]
"prismatic" = ["py.typed"]

# Single shared env: root + sde_harness. (serving/.venv stays isolated.)
[tool.uv.workspace]
members = ["sde_harness"]

[tool.uv.sources]
sde-harness = { workspace = true }

[tool.black]
line-length = 121
target-version = ["py310", "py311", "py312"]
preview = true

[tool.ruff]
line-length = 121
target-version = "py310"

[tool.ruff.lint]
select = ["A", "B", "E", "F", "I", "RUF", "W"]
ignore = ["F722"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402", "F401"]
