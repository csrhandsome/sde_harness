[project]
name = "vla-adapter-serving"
version = "0.2.0"
description = "Configuration-driven vLLM and Transformers serving for VLA-Adapter"
requires-python = ">=3.10,<3.13"
dependencies = [
    # Hy-Embodied-VLM-1.0 (official pin)
    "vllm==0.14.1",
    "hy-embodied-vllm-plugin",
    # HY-Embodied-0.5 OpenAI-compat server (transformers + FastAPI)
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "accelerate>=1.0",
    "transformers==4.57.6",
    # shared client / hub
    "openai>=1.30",
    "pillow",
    "huggingface-hub",
]

[tool.uv]
package = true

[project.scripts]
vla-serving = "vla_serving.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# CUDA torch wheels (matches official HY-Embodied pin: torch 2.9.1 + cu128).
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
hy-embodied-vllm-plugin = { path = "plugins/hy-embodied-vlm-1.0", editable = true }
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchaudio = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
